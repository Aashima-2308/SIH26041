  <script>
    function togglePassword() {
      const pwd = document.getElementById('password-input');
      const icon = document.getElementById('pwd-icon');
      if (pwd.type === 'password') {
        pwd.type = 'text';
        icon.textContent = 'visibility_off';
      } else {
        pwd.type = 'password';
        icon.textContent = 'visibility';
      }
    }

    async function handleWorkerLogin() {
    const btn = document.getElementById('login-submit-btn');

    const mobileNumber = document
      .getElementById('worker-id-input')
      .value
      .trim();

    const password = document
      .getElementById('password-input')
      .value;

    if (!mobileNumber || !password) {
      alert('Please enter mobile number and password.');
      return;
    }

    btn.disabled = true;
    btn.innerHTML = `
      <span class="material-symbols-outlined text-[20px] animate-spin">sync</span>
      <span>${ARmourI18n.t('loginWorker.authenticating')}</span>
    `;

    try {
      const response = await fetch(
        'https://armour-backend-e4lj.onrender.com/auth/login',
        {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            mobile_number: mobileNumber,
            password: password
          })
        }
      );

      const data = await response.json();

      if (!response.ok) {
        throw new Error(
          data.detail || 'Invalid mobile number or password.'
        );
      }

      console.log('LOGIN RESPONSE:', data);

      // Save authentication token
      if (data.access_token) {
        localStorage.setItem(
          'armour_access_token',
          data.access_token
        );
      }

      // Save basic session information
      sessionStorage.setItem(
        'armour_worker_id',
        mobileNumber
      );

      // Go to Worker Dashboard
      window.location.href = 'worker_training_home.html';

    } catch (error) {
      console.error('Login error:', error);

      alert(error.message);

      btn.disabled = false;
      btn.innerHTML = `
        <span>${ARmourI18n.t('loginWorker.loginButton')}</span>
      `;
    }
  }
