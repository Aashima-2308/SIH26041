<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ARmour – Admin Login</title>

  <!-- Google Fonts: Inter, JetBrains Mono, Work Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Work+Sans:wght@600;700&display=swap" rel="stylesheet">

  <!-- Material Symbols Outlined -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "surface":                    "#f8f9ff",
            "surface-bright":             "#f8f9ff",
            "surface-dim":                "#ccdbf4",
            "surface-variant":            "#d5e3fd",
            "surface-container-lowest":   "#ffffff",
            "surface-container-low":      "#eff4ff",
            "surface-container":          "#e6eeff",
            "surface-container-high":     "#dde9ff",
            "surface-container-highest":  "#d5e3fd",
            "background":                 "#f8f9ff",
            "on-surface":                 "#0d1c2f",
            "on-surface-variant":         "#45464d",
            "on-background":              "#0d1c2f",
            "primary":                    "#000000",
            "on-primary":                 "#ffffff",
            "primary-container":          "#131b2e",
            "on-primary-container":       "#7c839b",
            "primary-fixed":              "#dae2fd",
            "primary-fixed-dim":          "#bec6e0",
            "inverse-primary":            "#bec6e0",
            "on-primary-fixed":           "#131b2e",
            "on-primary-fixed-variant":   "#3f465c",
            "secondary":                  "#904d00",
            "on-secondary":               "#ffffff",
            "secondary-container":        "#fe932c",
            "on-secondary-container":     "#663500",
            "secondary-fixed":            "#ffdcc3",
            "secondary-fixed-dim":        "#ffb77d",
            "on-secondary-fixed":         "#2f1500",
            "on-secondary-fixed-variant": "#6e3900",
            "tertiary":                   "#000000",
            "on-tertiary":                "#ffffff",
            "tertiary-container":         "#002114",
            "on-tertiary-container":      "#069669",
            "tertiary-fixed":             "#85f8c4",
            "tertiary-fixed-dim":         "#68dba9",
            "on-tertiary-fixed":          "#002114",
            "on-tertiary-fixed-variant":  "#005137",
            "error":                      "#ba1a1a",
            "on-error":                   "#ffffff",
            "error-container":            "#ffdad6",
            "on-error-container":         "#93000a",
            "outline":                    "#76777d",
            "outline-variant":            "#c6c6cd",
            "inverse-surface":            "#233144",
            "inverse-on-surface":         "#ebf1ff",
            "surface-tint":               "#565e74",
          },
          fontFamily: {
            sans:    ["Inter", "sans-serif"],
            mono:    ["JetBrains Mono", "monospace"],
            display: ["Work Sans", "sans-serif"],
          }
        }
      }
    };
  </script>

  <style>
    html {
      width: 100%;
      margin: 0;
      padding: 0;
    }
    body {
      width: 100%;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: none;
    }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 16px); }
    .pt-safe { padding-top: env(safe-area-inset-top, 16px); }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
  </style>
</head>
<body class="bg-surface font-sans text-on-surface min-h-screen flex flex-col justify-between pt-safe pb-safe">

  <!-- Top App Bar -->
  <header class="w-full max-w-md mx-auto px-4 h-16 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <a href="role_selection.html" aria-label="Go back to role selection" class="w-10 h-10 -ml-2 rounded-full flex items-center justify-center text-on-surface hover:bg-surface-container-high transition-colors">
        <span class="material-symbols-outlined text-[24px]">arrow_back</span>
      </a>
      <img alt="ARmour Logo" class="h-7 w-auto object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuA09FDidBl1eillT6ZWbffAFwkwLY1CrNRV1d70nm9tAyKiqixJSfu202zcKjHaU0znRMMuxFjd3xz9R1f8vNxBJId5lyVC6obC2R0hq9Ka-kXe04CViaiZ8wpLnpm-c839XaqDJ_5Hahzxo0Uj7j9XurtPSwRJ22FNbeoxDS0WHLDanYSYWfIe4aTtBvFENAsaAebOv8eVXGmGXnliy1xDUrYg26D2HJS3Ph0IXTN_6KeQaqVhMDPLf0sS2Cmp1jFVu4g">
    </div>
    <span class="bg-secondary-container text-on-secondary-container font-mono text-[10px] px-2 py-0.5 rounded font-bold uppercase tracking-wider" data-i18n="loginAdmin.badge">
      ADMIN PORTAL
    </span>
  </header>

  <!-- Main Login Card Container -->
  <main class="w-full max-w-md mx-auto px-4 py-4 flex-1 flex flex-col justify-between">
    <div class="flex flex-col gap-5">
      <!-- Title & Headline -->
      <div class="px-1">
        <div class="flex items-center gap-2 text-secondary font-mono text-xs font-semibold uppercase tracking-wider mb-1">
          <span class="material-symbols-outlined text-[16px]">shield_person</span>
          <span data-i18n="loginAdmin.eyebrow">Proctor Authentication</span>
        </div>
        <h1 class="font-display text-2xl font-bold text-on-surface" data-i18n="loginAdmin.title">Admin Login</h1>
        <p class="text-sm text-on-surface-variant mt-1" data-i18n="loginAdmin.subtitle">
          Sign in to manage trainee training records, compliance stats, and safety assessments.
        </p>
      </div>

      <!-- Login Form Card -->
      <div class="bg-surface-container-lowest rounded-2xl p-6 shadow-sm border border-surface-container flex flex-col gap-5">
        <form id="admin-login-form" onsubmit="event.preventDefault(); handleAdminLogin();" class="flex flex-col gap-4">
          
          <!-- Email / Admin ID Input -->
          <div class="flex flex-col gap-1.5">
            <div class="flex items-center justify-between">
              <label class="text-xs font-semibold text-on-surface flex items-center gap-1" for="admin-email">
                <span data-i18n="loginAdmin.emailLabel">Official Email / Admin ID</span>
                <span class="text-error font-bold">*</span>
              </label>
              <button type="button" onclick="quickFillAdmin()" class="text-[11px] font-mono font-semibold text-secondary hover:underline" data-i18n="loginAdmin.demo">
                Demo Admin
              </button>
            </div>
            <div class="relative flex items-center bg-surface-container-low rounded-xl focus-within:bg-surface-container transition-colors">
              <span class="material-symbols-outlined absolute left-3.5 text-on-surface-variant text-[20px] pointer-events-none">
                badge
              </span>
              <input 
                id="admin-email" 
                type="text" 
                required 
                data-i18n-placeholder="loginAdmin.emailPlaceholder"
                placeholder="admin@armour.safety" 
                class="w-full h-12 pl-11 pr-4 bg-transparent font-sans text-sm text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none"
              >
            </div>
          </div>

          <!-- Password Input -->
          <div class="flex flex-col gap-1.5">
            <div class="flex items-center justify-between">
              <label class="text-xs font-semibold text-on-surface" for="admin-password">
                <span data-i18n="loginAdmin.passwordLabel">Password</span>
                <span class="text-error font-bold">*</span>
              </label>
              <a href="forgot_password.html" class="text-xs font-semibold text-secondary hover:underline" data-i18n="loginAdmin.forgot">
                Forgot password?
              </a>
            </div>
            <div class="relative flex items-center bg-surface-container-low rounded-xl focus-within:bg-surface-container transition-colors">
              <span class="material-symbols-outlined absolute left-3.5 text-on-surface-variant text-[20px] pointer-events-none">
                lock
              </span>
              <input 
                id="admin-password" 
                type="password" 
                required 
                placeholder="••••••••••••" 
                class="w-full h-12 pl-11 pr-12 bg-transparent font-sans text-sm text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none"
              >
              <button 
                type="button" 
                onclick="togglePassword()" 
                class="absolute right-2 w-10 h-10 flex items-center justify-center text-on-surface-variant hover:text-on-surface"
                aria-label="Toggle password visibility"
              >
                <span class="material-symbols-outlined text-[20px]" id="eye-icon">visibility</span>
              </button>
            </div>
          </div>

          <!-- Submit Button -->
          <button 
            id="admin-submit-btn" 
            type="submit" 
            class="w-full min-h-[50px] mt-2 bg-secondary-container text-on-secondary-container font-bold text-base rounded-xl shadow-md flex items-center justify-center gap-2 hover:opacity-95 active:scale-[0.99] transition-all cursor-pointer"
          >
            <span data-i18n="loginAdmin.submit">SIGN IN</span>
            <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
          </button>
        </form>

        <!-- Register Link -->
        <div class="pt-3 border-t border-surface-container flex items-center justify-center text-xs text-on-surface-variant gap-1.5">
          <span data-i18n="loginAdmin.newAdmin">New administrator?</span>
          <a href="worker_registration.html" class="font-semibold text-secondary hover:underline" data-i18n="loginAdmin.registerCta">
            Register as Admin
          </a>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="py-4 text-center">
      <span class="text-xs text-on-surface-variant font-mono" data-i18n="loginAdmin.footer">ARmour Administration System • Mining Safety Hub</span>
    </div>
  </main>

  <script src="i18n.js"></script>
  <script>
    function togglePassword() {
      const pwd = document.getElementById('admin-password');
      const icon = document.getElementById('eye-icon');
      if (pwd.type === 'password') {
        pwd.type = 'text';
        icon.textContent = 'visibility_off';
      } else {
        pwd.type = 'password';
        icon.textContent = 'visibility';
      }
    }

    function quickFillAdmin() {
      document.getElementById('admin-email').value = 'rajeshwar.verma@armour.safety';
      document.getElementById('admin-password').value = 'admin123';
    }

    function handleAdminLogin() {
      const btn = document.getElementById('admin-submit-btn');
      btn.disabled = true;
      btn.innerHTML = `
        <span class="material-symbols-outlined text-[20px] animate-spin">sync</span>
        <span>${ARmourI18n.t('loginAdmin.verifying')}</span>
      `;

      setTimeout(() => {
        // Direct transition to the live working admin dashboard
        window.location.href = 'admin_dashboard.html';
      }, 900);
    }
  </script>
</body>
</html>
