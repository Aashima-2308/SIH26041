  <script src="i18n.js"></script>
  <script>
    let selectedLang = 'sat'; // Defaults to Santali (regional mining pilot)

    function selectLanguage(lang) {
      selectedLang = lang;
      const langs = ['en', 'hi', 'sat'];

      langs.forEach(item => {
        const card = document.getElementById(`lang-${item}`);
        const radio = document.getElementById(`radio-${item}`);
        const icon = document.getElementById(`icon-${item}`);

        if (item === lang) {
          card.classList.remove('border-transparent');
          card.classList.add('border-secondary-container', 'shadow-md');
          radio.className = 'w-6 h-6 rounded-full bg-secondary-container flex items-center justify-center text-on-secondary-container shadow-sm';
          icon.className = 'material-symbols-outlined text-[16px] font-bold opacity-100';
        } else {
          card.classList.remove('border-secondary-container', 'shadow-md');
          card.classList.add('border-transparent');
          radio.className = 'w-6 h-6 rounded-full bg-surface-container-highest flex items-center justify-center text-on-surface-variant';
          icon.className = 'material-symbols-outlined text-[16px] opacity-0';
        }
      });
    }

    function continueToLogin() {
      // Save language choice via the shared ARmour i18n engine.
      // This persists to localStorage (armour_lang) so every other screen
      // in the app — not just this one — reads and displays it correctly,
      // and it survives a full page reload.
      ARmourI18n.setLang(selectedLang);
      window.location.href = 'worker_login.html';
    }

    // If the visitor already has a saved language (e.g. they went Back to
    // this screen), reflect that as the pre-selected option on load.
    (function initFromSavedLanguage() {
      var saved = ARmourI18n.getLang();
      if (saved) {
        selectLanguage(saved);
      }
    })();
  </script>
